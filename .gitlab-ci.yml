image: docker:24.0.5

services:
  - docker:24.0.5-dind

variables:
  DOCKER_TLS_CERTDIR: "/certs"
  IMAGE_TAG: $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA

stages:
  - build
  - deploy

build_backend:
  stage: build
  script:
    - echo "Building backend Docker image..."
    - cd backend
    - docker build -t $IMAGE_TAG .
    # In a real environment, you would log in and push to registry here
    # - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    # - docker push $IMAGE_TAG
  only:
    - main

deploy_backend:
  stage: deploy
  script:
    - echo "Deploying backend to Google Cloud..."
    # Deployment commands here (e.g., Cloud Run, GKE)
  only:
    - main
